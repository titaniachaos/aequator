name: Deploy VitePress site to Pages

# Same shape as the clown repository, which serves titaniachaos.com/clown/ from
# its own Pages deployment. This one serves /aequator/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Schema validation of the project data, plus the scan that keeps internal
      # Drive URLs, private document ids and contact details out of the build.
      # It gates the deploy, so a change that breaks it is never published.
      - name: Validate the project data
        run: npm run validate:data

      - name: Typecheck
        run: npm run typecheck

      # The build is itself the dead-link checker: ignoreDeadLinks is false, so
      # VitePress fails on an unresolved internal link.
      - name: Build VitePress
        run: npm run docs:build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
